function showDeath(){showUI(`<div class="big">YOU DIED</div><div class="s" style="font-size:15px">${stats()}</div>${G.reset?'<p style="color:#f55">NO REVIVES LEFT - STAGE RESTARTS</p>':S.diff=='ABYSS'?`<p>Revives left: ${G.revives}</p>`:''}<div><button onclick="revive()">${G.reset?'RESTART STAGE':'REVIVE'}</button><button onclick="menu()">MENU</button></div>`)}
function showEnd(t,w){showUI(`<div class="big">${t}</div><p>${w}</p><div class="s" style="font-size:15px">${stats()}</div><div><button onclick="startStage(G.n)">RETRY</button><button onclick="menu()">MENU</button></div>`)}

 if(G.n==10)extra=`<h2 style="color:#0ff">ECLIPSE CORE DEFEATED<br>MEMORY FRAGMENT RECOVERED</h2><p>MEMORY CODE: <b style="font-size:26px;color:#0ff;text-shadow:0 0 12px #0ff">${S.code}</b><br><span class="s">Enter it in THE LOST MEMORY. You can export it again from the main menu.</span></p>`;
 showUI(`<h1 style="color:#6f6">STAGE ${G.n} CLEAR</h1><div class="big" style="color:#fd4">${rk}</div><div class="s" style="font-size:15px">${stats()}<br>Par time: ${rankOf().par}s</div>${sec.map(s=>'<p style="color:#f8f">'+s+'</p>').join('')}${extra}<div>${G.n<10?'<button onclick="startStage('+(G.n+1)+')">NEXT STAGE</button>':''}<button onclick="menu()">MENU</button></div>${G.n==10&&S.abyss?'<p class="s">ABYSS MODE UNLOCKED.</p>':''}`)}
/* ---------- iPad / touch controls ---------- */
function touchKey(code,down){if(down){keys[code]=1;onKey(code)}else keys[code]=0}
const touchEl=document.getElementById('touch');
touchEl.querySelectorAll('button[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);touchKey(k,true)},{passive:false});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();touchKey(k,false)},{passive:false}))});
const atk=document.getElementById('touchAttack');if(atk){atk.addEventListener('pointerdown',e=>{e.preventDefault();atk.setPointerCapture?.(e.pointerId);mouse.d=1},{passive:false});['pointerup','pointercancel','pointerleave'].forEach(ev=>atk.addEventListener(ev,e=>{e.preventDefault();mouse.d=0},{passive:false}))}
C.addEventListener('touchstart',e=>{if(!G||G.over)return;const t=e.touches[0],r=C.getBoundingClientRect();mouse.x=(t.clientX-r.left)*VW/r.width;mouse.y=(t.clientY-r.top)*VH/r.height;e.preventDefault()},{passive:false});
C.addEventListener('touchmove',e=>{if(!G||G.over)return;const t=e.touches[0],r=C.getBoundingClientRect();mouse.x=(t.clientX-r.left)*VW/r.width;mouse.y=(t.clientY-r.top)*VH/r.height;e.preventDefault()},{passive:false});
/* ---------- boot ---------- */
addEventListener('keydown',e=>{if(e.repeat)return;keys[e.code]=1;if(e.code=='Space'||e.code.startsWith('Arrow'))e.preventDefault();if(UI.style.display=='none')onKey(e.code)});
addEventListener('keyup',e=>keys[e.code]=0);
C.addEventListener('mousemove',e=>{const r=C.getBoundingClientRect();mouse.x=(e.clientX-r.left)*VW/r.width;mouse.y=(e.clientY-r.top)*VH/r.height});
C.addEventListener('mousedown',()=>mouse.d=1);addEventListener('mouseup',()=>mouse.d=0);C.oncontextmenu=e=>e.preventDefault();
addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)paused=1});
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
 if(G){if(!G.over&&!paused)update(dt);draw()}}
requestAnimationFrame(loop);menu();
